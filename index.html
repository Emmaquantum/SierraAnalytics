        //ESTILO DEL BOTÓN HOPFION
        const QuantumHopfion = ({ isActive }) => {
            const mountRef = React.useRef(null);

            useEffect(() => {
                const width = 60; // Tamaño del botón
                const height = 60;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
                camera.position.z = 2.5;

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(width, height);
                mountRef.current.appendChild(renderer.domElement);

                const color1 = new THREE.Color("#216675");
                const color2 = new THREE.Color("#655AA4");

                const n_fibers = 15; // Reducido para rendimiento en botón
                const n_points = 50;
                const tubeRadius = 0.02;

                for (let i = 0; i < n_fibers; i++) {
                    const phi = i * 2 * Math.PI / n_fibers;
                    const theta = Math.PI / 2;
                    const points = [];

                    for (let j = 0; j <= n_points; j++) {
                        const eta = (j / n_points) * 2 * Math.PI;
                        const x1 = Math.cos(eta + phi/2) * Math.sin(theta/2);
                        const x2 = Math.sin(eta + phi/2) * Math.sin(theta/2);
                        const x3 = Math.cos(eta - phi/2) * Math.cos(theta/2);
                        const x4 = Math.sin(eta - phi/2) * Math.cos(theta/2);
                        const denom = 1 - x4;
                        points.push(new THREE.Vector3(x1/denom, x2/denom, x3/denom));
                    }

                    const curve = new THREE.CatmullRomCurve3(points);
                    const geometry = new THREE.TubeGeometry(curve, 32, tubeRadius, 6, false);
                    const material = new THREE.MeshBasicMaterial({ 
                        color: new THREE.Color().lerpColors(color1, color2, i / n_fibers),
                        transparent: true,
                        opacity: 0.9
                    });
                    
                    const mesh = new THREE.Mesh(geometry, material);
                    scene.add(mesh);
                }

                const animate = () => {
                    const animId = requestAnimationFrame(animate);
                    // La rotación se acelera si el menú está abierto
                    scene.rotation.y += isActive ? 0.02 : 0.008;
                    scene.rotation.x += 0.005;
                    renderer.render(scene, camera);
                    return animId;
                };

                const animId = animate();

                return () => {
                    cancelAnimationFrame(animId);
                    if (mountRef.current) mountRef.current.removeChild(renderer.domElement);
                    scene.traverse((object) => {
                        if (object.geometry) object.geometry.dispose();
                        if (object.material) object.material.dispose();
                    });
                };
            }, [isActive]);

            return <div ref={mountRef} className="hopfion-canvas-container" />;
        };
        
        
        //BOTON CUÁNTICO
        const QuantumContact = () => {
            const [isOpen, setIsOpen] = useState(false);
            
            const contacts = [
                { icon: 'mail', color: '#655AA4', href: 'mailto:julianssvr@gmail.com', delay: '0.1s', y: -130, x: 0 },
                { icon: 'linkedin', color: '#0077b5', href: 'https://linkedin.com/in/julianssvr', delay: '0.2s', y: -90, x: 90 },
                { icon: 'message-circle', color: '#25d366', href: 'https://wa.me/573176406113', delay: '0.3s', y: 0, x: 130 }
            ];

            return (
                <div className={`spin-container ${isOpen ? 'open' : ''}`}>
                    {contacts.map((c, i) => (
                        <a 
                            key={i}
                            href={c.href}
                            target="_blank"
                            className="spin-option shadow-lg"
                            style={{ 
                                backgroundColor: rgba(254, 254, 254, 0.1), //c.color,
                                transform: isOpen ? `translate(${c.x}px, ${c.y}px)` : 'translate(0,0)',
                                transitionDelay: isOpen ? c.delay : '0s'
                            }}
                        >
                            <i data-lucide={c.icon} className="w-5 h-5"></i>
                        </a>
                    ))}
                    <div 
                        className={`spin-trigger ${isOpen ? 'active' : ''}`}
                        onClick={() => setIsOpen(!isOpen)}
                    >
                    <QuantumHopfion isActive={isOpen} />
                    </div>
                </div>
            );
        };

        // MAIN APP
        const App = () => {
            useEffect(() => {
                lucide.createIcons();
            }, []);

            return (
                <div className="min-h-screen relative selection:bg-[#F7DCAF] selection:text-[#2E3849]">
                    <div className="grain"></div>
                    <Navbar />
                    <main>
                        <Hero />
                        <ProblemSection />
                        <Services />
                        <DiagnosticSection />
                    </main>
                    <Footer />
                    <QuantumContact />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
